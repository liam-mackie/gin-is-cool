# hello-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-k8s-html
  namespace: gin-#{Octopus.Environment.Name | toLower}
  labels:
    app: hello-k8s
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Fat Cats | Octopus Deploy</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
      <style>
        :root {
          --tabby: #7a4a24;
          --tabby-deep: #3f2412;
          --ginger: #e0833a;
          --cream: #f2c46d;
          --milk: #fbf5ec;
          --ink: #2a1f18;
          --muted: #6e5d50;
          --card: #ffffff;
          --serif: "Playfair Display", Georgia, "Times New Roman", serif;
          --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
          margin: 0;
          font-family: var(--sans);
          color: var(--ink);
          background: var(--milk);
          line-height: 1.6;
        }

        a { color: inherit; }

        .wrap {
          max-width: 1080px;
          margin: 0 auto;
          padding-inline: 1.5rem;
        }

        /* Hero */
        .hero {
          position: relative;
          overflow: hidden;
          color: var(--milk);
          background:
            radial-gradient(circle at 80% 20%, rgba(242, 196, 109, 0.28), transparent 40%),
            radial-gradient(circle at 10% 90%, rgba(224, 131, 58, 0.35), transparent 45%),
            linear-gradient(160deg, var(--tabby) 0%, var(--tabby-deep) 100%);
          padding-block: 6rem 7rem;
          text-align: center;
        }

        .paws span {
          position: absolute;
          bottom: -40px;
          font-size: 1.25rem;
          opacity: 0;
          animation: rise 9s infinite ease-in;
        }
        .paws span:nth-child(1) { left: 8%;  animation-duration: 8s; }
        .paws span:nth-child(2) { left: 22%; font-size: 0.9rem; animation-duration: 11s; animation-delay: 2s; }
        .paws span:nth-child(3) { left: 40%; font-size: 1.6rem; animation-duration: 10s; animation-delay: 4s; }
        .paws span:nth-child(4) { left: 58%; font-size: 1rem;   animation-duration: 7s;  animation-delay: 1s; }
        .paws span:nth-child(5) { left: 74%; animation-duration: 12s; animation-delay: 3s; }
        .paws span:nth-child(6) { left: 90%; font-size: 0.8rem; animation-duration: 9s;  animation-delay: 5s; }

        @keyframes rise {
          0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
          10%  { opacity: 0.5; }
          100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
          .paws { display: none; }
        }

        .eyebrow {
          display: inline-block;
          font-size: 0.8rem;
          font-weight: 600;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: var(--cream);
          border: 1px solid rgba(242, 196, 109, 0.5);
          border-radius: 999px;
          padding: 0.35rem 1rem;
          margin-bottom: 1.5rem;
        }

        .hero h1 {
          font-family: var(--serif);
          font-weight: 800;
          font-size: clamp(3rem, 9vw, 6rem);
          line-height: 1;
          margin: 0 0 1.25rem;
        }

        .hero h1 em {
          font-style: italic;
          font-weight: 600;
          color: var(--cream);
        }

        .hero p {
          max-width: 36rem;
          margin: 0 auto 2.5rem;
          font-size: 1.15rem;
          color: rgba(251, 245, 236, 0.85);
        }

        .btn {
          display: inline-block;
          text-decoration: none;
          font-weight: 600;
          padding: 0.85rem 1.75rem;
          border-radius: 999px;
          background: var(--cream);
          color: var(--tabby-deep);
          transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn:hover {
          transform: translateY(-2px);
          box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
        }

        /* Sections */
        section { padding-block: 5rem; }

        h2 {
          font-family: var(--serif);
          font-size: clamp(2rem, 5vw, 2.75rem);
          margin: 0 0 0.75rem;
          color: var(--tabby);
        }

        .lede {
          color: var(--muted);
          max-width: 40rem;
          margin: 0 0 3rem;
          font-size: 1.05rem;
        }

        /* Larry */
        .larry {
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
          gap: 3rem;
          align-items: center;
          background: var(--card);
          border-radius: 24px;
          padding: 3rem;
          box-shadow: 0 1px 2px rgba(63, 36, 18, 0.06), 0 12px 32px rgba(63, 36, 18, 0.08);
          border: 3px solid var(--ginger);
        }
        .larry .portrait {
          aspect-ratio: 1;
          border-radius: 50%;
          display: grid;
          place-items: center;
          font-size: clamp(6rem, 18vw, 10rem);
          background: radial-gradient(circle at 35% 30%, var(--cream), var(--ginger));
        }
        .larry .badge {
          display: inline-block;
          font-size: 0.75rem;
          font-weight: 600;
          letter-spacing: 0.15em;
          text-transform: uppercase;
          background: var(--ginger);
          color: var(--milk);
          border-radius: 999px;
          padding: 0.3rem 0.9rem;
          margin-bottom: 1rem;
        }
        .larry h2 { font-size: clamp(2.25rem, 6vw, 3.25rem); }
        .larry p { color: var(--muted); margin: 0 0 1rem; }
        .stats {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 1rem;
          margin-top: 1.5rem;
        }
        .stats div {
          background: var(--milk);
          border-radius: 14px;
          padding: 1rem;
          text-align: center;
        }
        .stats strong {
          display: block;
          font-family: var(--serif);
          font-size: 1.5rem;
          color: var(--tabby);
        }
        .stats span { font-size: 0.85rem; color: var(--muted); }

        @media (max-width: 720px) {
          .larry { grid-template-columns: 1fr; padding: 2rem 1.5rem; gap: 2rem; }
          .larry .portrait { max-width: 260px; margin: 0 auto; width: 100%; }
          .stats { grid-template-columns: 1fr; }
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
          gap: 1.5rem;
        }

        .card {
          background: var(--card);
          border-radius: 18px;
          padding: 2rem 1.75rem;
          box-shadow: 0 1px 2px rgba(63, 36, 18, 0.06), 0 8px 24px rgba(63, 36, 18, 0.06);
          border-top: 4px solid var(--ginger);
          transition: transform 0.2s ease;
        }
        .card:hover { transform: translateY(-4px); }
        .card:nth-child(2) { border-top-color: var(--cream); }
        .card:nth-child(3) { border-top-color: var(--tabby); }
        .card:nth-child(4) { border-top-color: #9a8f86; }

        .card .icon { font-size: 2rem; margin-bottom: 0.75rem; }

        .card h3 {
          font-family: var(--serif);
          font-size: 1.35rem;
          margin: 0 0 0.5rem;
          color: var(--tabby);
        }

        .card p { margin: 0; color: var(--muted); }

        /* Traits */
        .traits {
          background: var(--tabby);
          color: var(--milk);
        }
        .traits h2 { color: var(--milk); }
        .traits .lede { color: rgba(251, 245, 236, 0.75); }

        .pills {
          display: flex;
          flex-wrap: wrap;
          gap: 0.75rem;
          list-style: none;
          padding: 0;
          margin: 0;
        }
        .pills li {
          padding: 0.6rem 1.2rem;
          border-radius: 999px;
          background: rgba(251, 245, 236, 0.08);
          border: 1px solid rgba(251, 245, 236, 0.2);
          font-weight: 500;
        }
        .pills li.star {
          background: var(--cream);
          color: var(--tabby-deep);
          border-color: var(--cream);
        }

        /* Steps */
        .steps {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
          gap: 1.5rem;
        }
        .step {
          display: flex;
          gap: 1.25rem;
          align-items: flex-start;
          padding: 1.5rem;
          border-radius: 18px;
          background: var(--card);
          box-shadow: 0 1px 2px rgba(63, 36, 18, 0.06);
        }
        .step .num {
          flex: none;
          font-family: var(--serif);
          font-size: 2.25rem;
          font-weight: 800;
          line-height: 1;
          color: var(--ginger);
        }
        .step h3 {
          margin: 0 0 0.25rem;
          font-size: 1.1rem;
          color: var(--tabby);
        }
        .step p { margin: 0; color: var(--muted); font-size: 0.95rem; }

        /* Quote */
        blockquote {
          margin: 0 auto;
          max-width: 46rem;
          text-align: center;
          font-family: var(--serif);
          font-style: italic;
          font-size: clamp(1.5rem, 4vw, 2.25rem);
          line-height: 1.35;
          color: var(--tabby);
        }
        blockquote cite {
          display: block;
          margin-top: 1rem;
          font-family: var(--sans);
          font-style: normal;
          font-size: 0.95rem;
          color: var(--muted);
        }

        footer {
          background: var(--tabby-deep);
          color: rgba(251, 245, 236, 0.7);
          text-align: center;
          padding-block: 2.5rem;
          font-size: 0.9rem;
        }
        footer strong { color: var(--cream); }
      </style>
    </head>
    <body>

      <header class="hero">
        <div class="paws" aria-hidden="true">
          <span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span>
        </div>
        <div class="wrap">
          <span class="eyebrow">A public service announcement from Octopus Deploy</span>
          <h1>Fat cats are <em>the best.</em></h1>
          <p>Round, heavy, and unbothered. Fat cats have worked out that a good life is mostly naps and snacks, and they would like you to catch up.</p>
          <a class="btn" href="#larry">Meet Larry</a>
        </div>
      </header>

      <main>
        <section id="larry">
          <div class="wrap">
            <article class="larry">
              <div class="portrait" aria-hidden="true">🐈</div>
              <div>
                <span class="badge">Fat Cat of the Year</span>
                <h2>Larry</h2>
                <p>Every fat cat is great. Larry is the greatest. He treats a sunbeam like a job and a cushion like a throne, and dinner is never far from his mind.</p>
                <p>Larry doesn't chase things, he waits for them to come to him. It works every time.</p>
                <div class="stats">
                  <div><strong>18h</strong><span>naps per day</span></div>
                  <div><strong>∞</strong><span>treats deserved</span></div>
                  <div><strong>0</strong><span>stairs taken willingly</span></div>
                </div>
              </div>
            </article>
          </div>
        </section>

        <section id="why">
          <div class="wrap">
            <h2>Why fat cats?</h2>
            <p class="lede">A regular cat is nice. A fat cat is more of a nice cat, and that's just maths.</p>
            <div class="grid">
              <article class="card">
                <div class="icon" aria-hidden="true">🛋️</div>
                <h3>Masters of rest</h3>
                <p>Fat cats have turned lounging into an art. Watch one settle into a cushion and you'll see what we mean.</p>
              </article>
              <article class="card">
                <div class="icon" aria-hidden="true">🫓</div>
                <h3>The loaf</h3>
                <p>Paws tucked in and a perfect rectangle on the couch. Only a truly round cat can pull off a loaf this good.</p>
              </article>
              <article class="card">
                <div class="icon" aria-hidden="true">🤗</div>
                <h3>Maximum cuddle</h3>
                <p>More cat per cuddle and a warm lap all winter. The value for money is hard to beat.</p>
              </article>
              <article class="card">
                <div class="icon" aria-hidden="true">😼</div>
                <h3>Unbothered</h3>
                <p>Deadlines, meetings, failed builds: none of it gets through to a fat cat. We could all learn something.</p>
              </article>
            </div>
          </div>
        </section>

        <section class="traits">
          <div class="wrap">
            <h2>What fat cats bring</h2>
            <p class="lede">Being round is the only rule. Everything else is a bonus.</p>
            <ul class="pills">
              <li class="star">Chonk</li>
              <li>Belly floof</li>
              <li>Loafing</li>
              <li>Slow blinks</li>
              <li>Toe beans</li>
              <li>Purring</li>
              <li>Keyboard warming</li>
              <li>Sunbeam naps</li>
              <li>Snack radar</li>
              <li>Judgemental stares</li>
              <li>Biscuit making</li>
              <li>Gravitas</li>
              <li>Lap weight</li>
              <li>Excellent vibes</li>
            </ul>
          </div>
        </section>

        <section>
          <div class="wrap">
            <h2>Start here</h2>
            <p class="lede">Four ways to show a fat cat the respect they deserve.</p>
            <div class="steps">
              <div class="step">
                <span class="num">01</span>
                <div>
                  <h3>Offer a lap</h3>
                  <p>Sit down and stay still. The cat will decide when you're allowed to get up.</p>
                </div>
              </div>
              <div class="step">
                <span class="num">02</span>
                <div>
                  <h3>Rub the belly (carefully)</h3>
                  <p>It might be an invitation. It might be a trap. Go in knowing the risks.</p>
                </div>
              </div>
              <div class="step">
                <span class="num">03</span>
                <div>
                  <h3>Take photos</h3>
                  <p>A fat cat in a box that's too small is the best thing on the internet. Record it.</p>
                </div>
              </div>
              <div class="step">
                <span class="num">04</span>
                <div>
                  <h3>Spread the word</h3>
                  <p>Share this page. Everyone at Octopus deserves to know about Larry.</p>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section>
          <div class="wrap">
            <blockquote>
              "I'm not fat. I'm fluffy, and my bones are big, and I'm due for a snack."
              <cite>Larry (probably)</cite>
            </blockquote>
          </div>
        </section>
      </main>

      <footer>
        <div class="wrap">
          Served fresh from Kubernetes, deployed with Octopus. <strong>Larry is a fat cat.</strong> Please pat responsibly.
        </div>
      </footer>

    </body>
    </html>
